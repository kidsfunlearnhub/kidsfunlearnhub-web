<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Match Game</title>
    <link rel="stylesheet" href="game.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="game-container">
        
        <div class="header-row">
            <h1 id="game-title">🐾 Shadow Match!</h1>
            <div class="score-board">
                <span id="score-label">Score:</span> 
                <span id="score">0</span>
            </div>
        </div>

        <div class="language-container">
            <div class="language-selector">
                <button class="lang-btn active" data-lang="en">English</button>
                <button class="lang-btn" data-lang="hi">हिंदी</button>
                <button class="lang-btn" data-lang="mr">मराठी</button>
            </div>
        </div>

        <div id="promptBox" class="prompt-box">
            <div class="speaker-icon">🔊</div>
            <div>
                <h2 id="instruction">Match the animals to their shadows!</h2>
            </div>
        </div>

        <div class="match-game-wrapper" id="match-container">
            <svg id="line-canvas"></svg>

            <div class="column" id="left-column">
                </div>

            <div class="column" id="right-column">
                </div>
        </div>

        <div class="bottom-actions">
            <button id="backBtn" class="action-btn">⬅ Back to Activity Hub</button>
        </div>
    </div>

    <div id="feedback" class="feedback-overlay hidden">
        <div class="feedback-content">
            <h2 id="feedback-text" class="correct-text">Great Job! 🎉</h2>
            <div style="font-size: 80px; animation: popIn 0.5s;">⭐</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
