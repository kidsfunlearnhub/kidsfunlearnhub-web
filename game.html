<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Tap Game</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h2 id="instruction">Tap the CAT 🐱</h2>

<!-- Bucket -->
<div id="bucket">
⭐ <span id="stars">0</span>
</div>

<!-- Game Grid -->
<div id="gameGrid"></div>

<!-- Popup -->
<div id="popup">
  <div class="popupBox">
      <h2>🎉 Correct!</h2>
          <p>You found the CAT!</p>
              <button onclick="closePopup()">Continue</button>
                </div>
                </div>

                <!-- Confetti -->
                <canvas id="confetti"></canvas>

                <script src="script.js"></script>
                </body>
                </html>
