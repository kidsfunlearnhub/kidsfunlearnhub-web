<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big & Small Letters</title>
  <link rel="stylesheet" href="abc11.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <h1 id="page-title">🔠 Big & Small Letters</h1>

  <div class="grid-container" id="lettersGrid"></div>

  <div id="abcOverlay" class="hidden">
    <div id="abcPopupCard">
      
      <div class="letter-buddies">
         <span id="bigLetter">A</span>
         <span id="smallLetter">a</span>
      </div>

      <h2 id="popupText"></h2>
      <p class="close-hint" id="close-hint">Tap anywhere to close</p>
    </div>
  </div>

  <script src="abc11.js"></script>
</body>
</html>
