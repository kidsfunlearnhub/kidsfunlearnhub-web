<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidsFunLearnHub - Magic Marker Tracing</title>
    <style>
        :root {
            --primary-pink: #FF6B6B;
            --soft-blue: #4D96FF;
            --sunny-yellow: #FFD93D;
            --grass-green: #6BCB77;
            --marker-color: #4D96FF;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background-color: #f0faff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            cursor: none; /* Hide default cursor to show our marker */
        }

        #header { text-align: center; padding: 15px; pointer-events: none; }
        h1 { color: var(--primary-pink); margin: 0; font-size: 2.2rem; text-shadow: 2px 2px #fff; }

        #game-container {
            position: relative;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 8px solid var(--sunny-yellow);
            overflow: hidden;
        }

        #tracing-canvas {
            display: block;
            background-image: 
                linear-gradient(#f1f1f1 1px, transparent 1px),
                linear-gradient(90deg, #f1f1f1 1px, transparent 1px);
            background-size: 40px 40px; /* Gives a paper-grid feel */
        }

        /* The Custom Marker */
        #marker-cursor {
            position: fixed;
            width: 50px;
            height: 50px;
            font-size: 40px;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 999;
            transform: translate(-10%, -90%); /* Position tip at coordinates */
            transition: transform 0.05s linear;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .btn-clear { background-color: var(--primary-pink); }
        .btn-next { background-color: var(--grass-green); }
        button:active { transform: translateY(3px); box-shadow: none; }

        /* Reward Animation */
        #reward-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .star { font-size: 120px; opacity: 0; transition: 0.5s; }
        .star.show { opacity: 1; transform: scale(1.5) rotate(20deg); }
    </style>
</head>
<body>

<div id="marker-cursor">🖍️</div>

<div id="header">
    <h1>Magic Marker Tracing</h1>
</div>

<div id="game-container">
    <canvas id="tracing-canvas" width="400" height="500"></canvas>
    <div id="reward-container"><span class="star" id="star-reward">🌟</span></div>
</div>

<div class="controls">
    <button class="btn-clear" onclick="clearCanvas()">Start Over</button>
    <button class="btn-next" onclick="nextLetter()">New Letter</button>
</div>

<script>
    const canvas = document.getElementById('tracing-canvas');
    const ctx = canvas.getContext('2d');
    const marker = document.getElementById('marker-cursor');
    const star = document.getElementById('star-reward');
    
    let isDrawing = false;
    let currentIdx = 0;
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789".split("");
    const colors = ['#4D96FF', '#FF6B6B', '#6BCB77', '#FFD93D', '#9b59b6'];

    function init() {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        drawGuide();
    }

    function drawGuide() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "bold 380px 'Arial'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        // The faint "path" to follow
        ctx.strokeStyle = "#ebebeb";
        ctx.lineWidth = 60; 
        ctx.strokeText(alphabet[currentIdx], canvas.width/2, canvas.height/2 + 30);
        
        // Dashed center line
        ctx.strokeStyle = "#cccccc";
        ctx.setLineDash([15, 15]);
        ctx.lineWidth = 4;
        ctx.strokeText(alphabet[currentIdx], canvas.width/2, canvas.height/2 + 30);
        ctx.setLineDash([]); 
    }

    // Move custom marker with mouse/touch
    function updateMarkerPos(e) {
        const x = e.clientX || e.touches[0].clientX;
        const y = e.clientY || e.touches[0].clientY;
        marker.style.left = x + 'px';
        marker.style.top = y + 'px';
        
        // Tilt marker when drawing
        if(isDrawing) {
            marker.style.transform = "translate(-10%, -90%) rotate(-15deg) scale(1.1)";
        } else {
            marker.style.transform = "translate(-10%, -90%) rotate(0deg) scale(1)";
        }
    }

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function stopDrawing() {
        if(isDrawing) checkCompletion();
        isDrawing = false;
        ctx.beginPath();
    }

    function draw(e) {
        updateMarkerPos(e);
        if (!isDrawing) return;

        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.lineWidth = 45; // Thick marker stroke
        ctx.strokeStyle = colors[currentIdx % colors.length];

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        star.classList.remove('show');
        drawGuide();
    }

    function nextLetter() {
        currentIdx = (currentIdx + 1) % alphabet.length;
        clearCanvas();
    }

    function checkCompletion() {
        // Simple trigger for visual delight
        star.classList.add('show');
        setTimeout(() => star.classList.remove('show'), 1500);
    }

    // Event Listeners
    window.addEventListener('mousemove', updateMarkerPos);
    canvas.addEventListener('mousedown', startDrawing);
    window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);

    // Touch Support
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    window.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

    init();
</script>

</body>
</html>
