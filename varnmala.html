<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Varnamala</title>
    <link rel="stylesheet" href="varnmala.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <h1 id="page-title">अ Learn Varnamala</h1>

            <h2 id="popupName"></h2>
        </div>
    </div>

    <script src="varnmala.js"></script>
