<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet Bundles | KidsFunLearnHub</title>
    <meta name="title" content="Worksheet Bundles | KidsFunLearnHub">
    <meta name="description" content="Download our premium, high-quality printable PDF worksheet bundles for toddlers, preschool, and kindergarten.">
    
    <link rel="canonical" href="https://www.kidsfunlearnhub.com/worksheets.html">
    <link rel="stylesheet" href="worksheets.css?v=6.4">
</head>
<body>
    <div class="site-branding">
        <a href="index.html">🚀 KidsFunLearnHub</a>
    </div>

    <header>
        <h1 class="title" id="page-title">📄 Worksheet Bundles</h1>
        <nav class="home-nav">
          <a href="index.html" class="home-btn">🏠 Home</a>
          <a href="activityhub.html" class="home-btn" style="background:#ff9800; margin-left:10px;">🎮 Activity Hub</a>
        </nav>
    </header>

    <main class="page-wrapper">
        <section class="hero-search-section">
            <div class="search-box-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="worksheetSearch" placeholder="Search tracing, english, hindi..." aria-label="Search worksheets">
            </div>
        </section>

        <nav class="category-nav" aria-label="Worksheet Categories">
            <button class="filter-btn active" data-category="all" style="--btn-color: #9c27b0;">✨ All Bundles</button>
            <button class="filter-btn" data-category="tracing" style="--btn-color: #ff5722;">✏️ Tracing</button>
            <button class="filter-btn" data-category="math" style="--btn-color: #2196f3;">🔢 Math</button>
            <button class="filter-btn" data-category="languages" style="--btn-color: #4caf50;">🔤 Languages</button>
            <button class="filter-btn" data-category="coloring" style="--btn-color: #ffc107;">🎨 Coloring</button>
            <button class="filter-btn" data-category="cognitive" style="--btn-color: #e91e63;">🧠 Logic</button>
        </nav>

        <div class="content-grid-container">
            <!-- JS will dynamically load cards here -->
            <section class="worksheets-grid" id="worksheetsGrid" aria-live="polite"></section>
        </div>

        <div id="noResults" class="no-results hidden">
            <span class="no-results-emoji">🎈</span>
            <h2>Oops! We couldn't find that one!</h2>
            <p>Try searching for words like "tracing", "numbers", or "hindi".</p>
        </div>
    </main>

    <footer class="footer">
        <p class="copyright">© 2026 KidsFunLearnHub. All rights reserved.</p>
    </footer>

    <!-- 1. Product Detail Modal -->
    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">✖</button>
            <div class="modal-body">
                <!-- Carousel Section -->
                <div class="modal-carousel-wrapper">
                    <button id="prevSlide" class="carousel-arrow left-arrow">❮</button>
                    <div id="modalCarousel" class="modal-carousel"></div>
                    <button id="nextSlide" class="carousel-arrow right-arrow">❯</button>
                </div>
                <!-- Details Section -->
                <div class="modal-info">
                    <div id="modalBadge" class="lang-badge" style="position:relative; display:inline-block; top:0; left:0; margin-bottom:10px;"></div>
                    <h2 id="modalTitle"></h2>
                    <h3 id="modalPrice" class="modal-price"></h3>
                    <p id="modalDesc" class="modal-description"></p>
                    <a href="#" id="modalBuyBtn" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Fullscreen Image Zoom (Lightbox) -->
    <div id="zoomModal" class="zoom-overlay hidden">
        <button id="closeZoom" class="close-btn" style="color: white; right: 30px; top: 30px; font-size: 40px;">✖</button>
        <img id="zoomImg" src="" alt="Zoomed Preview">
    </div>

    <script src="worksheets.js?v=6.1"></script>
</body>
</html>
