<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kids Body Learning</title>

<link rel="stylesheet" href="bodyparts.css">
</head>

<body>

<h1>👶 Learn Body Parts</h1>

<div class="viewer">

  <!-- rotating body -->
  <div class="body-container">
    <img src="images/bodyparts/body.png" class="body-img">

    <!-- hotspots -->
    <div class="hotspot" style="top:8%;left:45%;" 
         data-name="Head" data-img="images/head.png"></div>

    <div class="hotspot" style="top:23.2%; left:76.3%;" 
         data-name="Hair" data-img="images/hair.png"></div>

    <div class="hotspot" style="top:33.3%; left:58.9%;" 
         data-name="Eyes" data-img="images/eye.png"></div>
    <div class="hotspot" style="top:33.5%; left:86.3%;" 
         data-name="Eyes" data-img="images/eye.png"></div>

    <div class="hotspot" style="top:36.6%; left:74.0%;" 
         data-name="Nose" data-img="images/nose.png"></div>     

    <div class="hotspot" style="top:35.2%; left:40.9%;" 
         data-name="Ear" data-img="images/ear.png"></div>
    <div class="hotspot" style="top:35.4%; left:104%;" 
         data-name="Ear" data-img="images/ear.png"></div>

    <div class="hotspot" style="top:52%; left:74.9%;" 
         data-name="Chest" data-img="images/chest.png"></div>

    <div class="hotspot" style="top:64.4%; left:73.4%;" 
         data-name="Stomach" data-img="images/stomach.png"></div>

    <div class="hotspot" style="top:61.1%;left:47.00%;"
         data-name="Hand" data-img="images/hand.png"></div>

    <div class="hotspot" style="top:61.5%;left:99.1%;"
         data-name="Hand" data-img="images/hand.png"></div>

    <div class="hotspot" style="top:85.4%;left:62.6%;" 
         data-name="Leg" data-img="images/leg.png"></div>

    <div class="hotspot" style="top:85.9%;left:84.9%;" 
         data-name="Leg" data-img="images/leg.png"></div>

  </div>

</div>

<!-- popup -->
<div id="popup" class="popup hidden">
  <div class="popup-content">
    <span id="closeBtn">✖</span>
    <img id="popupImg">
    <h2 id="popupText"></h2>
  </div>
</div>

<script src="bodyparts.js"></script>

</body>
</html>
